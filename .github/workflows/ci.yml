name: CI Pipeline

on:
  push:
    branches: ["main", "feature/**", "fix/**"]
  pull_request:
    branches: ["main"]

env:
  BACKEND_IMAGE:  ${{ secrets.DOCKER_USERNAME }}/devoopsp-backend
  WORKER_IMAGE:   ${{ secrets.DOCKER_USERNAME }}/devoopsp-worker
  FRONTEND_IMAGE: ${{ secrets.DOCKER_USERNAME }}/devoopsp-frontend

jobs:

  test-backend:
    name: Test .NET Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-dotnet
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore
      - name: Test
        run: dotnet test --no-build --verbosity normal

  test-worker:
    name: Test Python Worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker-python
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Lint with ruff
        run: ruff check .
      - name: Test
        run: pytest tests/ -v

  test-frontend:
    name: Test Next.js Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-nextjs
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend-nextjs/package-lock.json
      - name: Install deps
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test -- --watchAll=false

  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: [test-backend, test-worker, test-frontend]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend-dotnet
          push: true
          tags: ${{ env.BACKEND_IMAGE }}:latest
      - name: Build & push worker
        uses: docker/build-push-action@v5
        with:
          context: ./worker-python
          push: true
          tags: ${{ env.WORKER_IMAGE }}:latest
      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend-nextjs
          push: true
          tags: ${{ env.FRONTEND_IMAGE }}:latest

  trigger-jenkins:
    name: Trigger Jenkins CD
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Notify Jenkins
        run: |
          curl -X POST \
            "${{ secrets.JENKINS_URL }}/job/DevOop-deploy/build" \
            --user "${{ secrets.JENKINS_USER }}:${{ secrets.JENKINS_TOKEN }}"
          echo "✅ Jenkins deployment triggered"
